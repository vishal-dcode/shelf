<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelf</title>
    <link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
    <script src="theme-init.js"></script>
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/newtab.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to collections</a>

    <div class="app" id="app">
      <!-- Column 1: navigation -->
      <nav class="sidebar" id="sidebar" aria-label="Spaces">
        <div class="brand">
          <img src="icons/logo.svg" alt="" width="22" height="18" />
          <span class="brand-name">Shelf</span>
          <button type="button" class="icon-btn brand-toggle" id="sidebar-close" data-key="sidebar-close" aria-controls="sidebar"></button>
        </div>

        <div class="side-search">
          <label class="sr-only" for="search">Search saved tabs in all spaces</label>
          <span class="side-search-icon" id="search-icon"></span>
          <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
          <kbd class="side-search-kbd" id="search-kbd" aria-hidden="true"></kbd>
        </div>

        <ul class="nav-list" id="nav-views"></ul>

        <div class="nav-group">
          <div class="nav-group-head">
            <h2 class="nav-group-title overline" id="spaces-heading">Spaces</h2>
          </div>
          <ul class="nav-list" id="nav-spaces" aria-labelledby="spaces-heading"></ul>
          <button type="button" class="nav-item nav-create" id="create-space" data-key="create-space"></button>
        </div>

        <div class="sidebar-foot">
          <button type="button" class="account-btn" id="account-btn" data-key="account" aria-haspopup="menu" aria-expanded="false"></button>
        </div>
      </nav>

      <!-- Column 2: one white panel holding the shelves and the open tabs -->
      <div class="workspace">
        <main class="board" id="main" tabindex="-1" aria-busy="true">
          <header class="board-head" id="board-head"></header>
          <div id="error" class="banner" role="alert" hidden>
            <p id="error-text"></p>
            <button type="button" class="btn btn-ghost" id="error-dismiss">Dismiss</button>
          </div>
          <div class="board-body" id="board-body"></div>
        </main>

        <!-- Column 3: open tabs -->
        <aside class="tabs-panel" id="tabs-panel" aria-labelledby="tabs-heading">
          <div class="tabs-head">
            <button type="button" class="icon-btn" id="tabs-close" data-key="tabs-close" aria-controls="tabs-panel"></button>
            <h2 class="tabs-title" id="tabs-heading">Open tabs</h2>
            <span class="meta" id="tabs-count"></span>
          </div>
          <div class="tabs-body" id="tabs-body"></div>
        </aside>
      </div>
    </div>

    <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden />

    <dialog id="dialog" aria-labelledby="dialog-title">
      <form id="dialog-form" method="dialog" novalidate>
        <h2 id="dialog-title" class="dialog-title"></h2>
        <p id="dialog-body" class="dialog-body" hidden></p>
        <div id="dialog-field" class="field" hidden>
          <label for="dialog-input" id="dialog-label"></label>
          <input id="dialog-input" type="text" maxlength="80" autocomplete="off" aria-describedby="dialog-error" />
          <p id="dialog-error" class="field-error" hidden></p>
        </div>
        <div id="dialog-second-field" class="field" hidden>
          <label for="dialog-second" id="dialog-second-label"></label>
          <input id="dialog-second" type="text" maxlength="2048" autocomplete="off" spellcheck="false" aria-describedby="dialog-second-error" />
          <p id="dialog-second-error" class="field-error" hidden></p>
        </div>
        <div id="dialog-area-field" class="field" hidden>
          <label for="dialog-area" id="dialog-area-label"></label>
          <textarea id="dialog-area" rows="7" maxlength="10000"></textarea>
        </div>
        <label id="dialog-check-wrap" class="check" hidden>
          <input type="checkbox" id="dialog-check" />
          <span id="dialog-check-label"></span>
        </label>
        <div class="dialog-actions">
          <button type="button" class="btn btn-secondary" id="dialog-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="dialog-confirm"></button>
        </div>
      </form>
    </dialog>

    <dialog id="settings" class="settings" aria-labelledby="settings-title"></dialog>
    <dialog id="share" class="settings share is-wide" aria-labelledby="share-title"></dialog>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
